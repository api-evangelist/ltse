name: LTSE
description: The Long-Term Stock Exchange (LTSE) is a U.S. national securities exchange, approved by the
  SEC, built to help companies and investors focus on long-term value creation over short-term results.
  LTSE operates a stock exchange and trading platform with listing standards organized around five
  long-term principles covering stakeholders, strategy, executive compensation, board governance, and
  investor engagement. The company also publishes market and governance insights and produces The Eric
  Ries Show podcast. LTSE previously offered a cap-table management product (LTSE Equity, formerly
  Captable.io) which has since been sunset and transitioned to Astrella. LTSE exposes no public developer
  API, SDK, or developer portal; this profile captures its public web and security posture.
